# MySQL Database - Docker container for production
spring.datasource.url=jdbc:mysql://localhost:3307/herbarium_db
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Change from create-drop to update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.defer-datasource-initialization=true

# Disable H2 console for MySQL profile
spring.h2.console.enabled=false

# Server port
server.port=8080