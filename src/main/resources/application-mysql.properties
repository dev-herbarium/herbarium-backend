# src/main/resources/application-mysql.properties

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/herbarium_db
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Force data.sql execution for MySQL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.datasource.initialization-mode=always

# Disable H2 console for MySQL profile
spring.h2.console.enabled=false

server.port=8080

spring.sql.init.data-locations=classpath:data-mysql.sql
spring.sql.init.mode=always